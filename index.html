<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Rose a Distanza – San Valentino</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sky">
    <div class="stars"></div>
    <div class="gradient"></div>
  </div>

  <header class="header">
    <h1>Rose a Distanza</h1>
    <p>Un viaggio di rose che volano verso chi ami, solo con HTML &amp; CSS.</p>
  </header>

  <main>
    <section class="scene">
      <!-- bouquet “spedito” -->
      <div class="bouquet-wrapper">
        <div class="bouquet-shadow"></div>
        <div class="bouquet floating">
          <!-- tre rose principali -->
          <div class="rose rose--left">
            <div class="petal petal-1"></div>
            <div class="petal petal-2"></div>
            <div class="petal petal-3"></div>
            <div class="petal petal-4"></div>
            <div class="bud"></div>
            <div class="stem"></div>
            <div class="leaf leaf-left"></div>
            <div class="leaf leaf-right"></div>
          </div>

          <div class="rose rose--center">
            <div class="petal petal-1"></div>
            <div class="petal petal-2"></div>
            <div class="petal petal-3"></div>
            <div class="petal petal-4"></div>
            <div class="bud"></div>
            <div class="stem"></div>
            <div class="leaf leaf-left"></div>
            <div class="leaf leaf-right"></div>
          </div>

          <div class="rose rose--right">
            <div class="petal petal-1"></div>
            <div class="petal petal-2"></div>
            <div class="petal petal-3"></div>
            <div class="petal petal-4"></div>
            <div class="bud"></div>
            <div class="stem"></div>
            <div class="leaf leaf-left"></div>
            <div class="leaf leaf-right"></div>
          </div>

          <!-- carta del bouquet -->
          <div class="wrap">
            <div class="wrap-left"></div>
            <div class="wrap-right"></div>
            <div class="ribbon"></div>
          </div>
        </div>
      </div>

      <!-- qualche rosa “lontana” che suggerisce il viaggio -->
      <div class="floating-rose tiny tiny-1"></div>
      <div class="floating-rose tiny tiny-2"></div>
      <div class="floating-rose tiny tiny-3"></div>
    </section>

    <section class="caption">
      <p>
        Le rose non arrivano davvero, ma l’idea sì: un bouquet che viaggia nello schermo,
        pensato per San Valentino.
      </p>
    </section>
  </main>

  <footer class="footer">
    <small>Template ideologico di rose “spedite” – puro front‑end.</small>
  </footer>

  <script src="script.js"></script>
</body>
</html>
